version: "3.9"

services:
    moodle:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                MOODLE_VERSION: MOODLE_404_STABLE
                PHP_VERSION: "8.2"
        container_name: moodle-app
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        ports:
            - "8080:80"
        environment:
            MOODLE_DB_TYPE: mariadb
            MOODLE_DB_HOST: db
            MOODLE_DB_PORT: "3306"
            MOODLE_DB_NAME: moodle
            MOODLE_DB_USER: moodle
            MOODLE_DB_PASS: ${MOODLE_DB_PASS:-changeme}

            MOODLE_SITE_URL: http://localhost:8080
            MOODLE_SITE_NAME: "Computer Tech"

            MOODLE_ADMIN_USER: admin
            MOODLE_ADMIN_PASS: ${MOODLE_ADMIN_PASS:-Admin1234!}
            MOODLE_ADMIN_EMAIL: admin@example.com

            PLUGIN_MANIFEST: /etc/moodle/plugins.json
        volumes:
            - moodle-data:/var/moodledata
            - ./plugins.json:/etc/moodle/plugins.json:ro
        networks:
            - moodle-net

    db:
        image: mariadb:10.11
        container_name: moodle-db
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootsecret}
            MARIADB_DATABASE: moodle
            MARIADB_USER: moodle
            MARIADB_PASSWORD: ${MOODLE_DB_PASS:-changeme}
        volumes:
            - db-data:/var/lib/mysql
            - ./config/mariadb.cnf:/etc/mysql/conf.d/moodle.cnf:ro
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - moodle-net

    redis:
        image: redis:7-alpine
        container_name: moodle-redis
        restart: unless-stopped
        command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
        volumes:
            - redis-data:/data
        networks:
            - moodle-net

volumes:
    moodle-data:
    db-data:
    redis-data:

networks:
    moodle-net:
        driver: bridge
